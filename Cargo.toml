[package]
name = "payments-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A toy payments engine: streams transactions from CSV, outputs client account balances"
publish = false

[dependencies]
anyhow = "1"
csv = "1.4"
rust_decimal = "1.43"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Cherry-picked from `restriction` (the Clippy book advises against enabling the whole group).
# Money code must not panic on data, wrap on overflow, or touch floats; stdout is reserved for the CSV.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
float_arithmetic = "warn"
print_stdout = "warn"
dbg_macro = "warn"
